name: CI

on:
  push:
    branches: [main]
  pull_request:

# Engine-only CI for the published RavenCore package (the RavenVault monorepo
# runs its own, wider pipeline). Runner note: GitHub deprecated the macOS 14
# runner images in 2026 and drops support on 2026-11-02; macos-15 is Apple
# Silicon arm64 and ships Xcode 16.x+ with iOS simulator runtimes.
#
# Supply-chain posture: checkout only — no third-party actions, no SPM
# dependencies, no caches, no tool installs, no downloads. The corpus and test
# vectors are committed, so every job runs fully offline (the one
# sanctioned fetch is Apple's iOS simulator runtime installer above).
#
# Failure diagnostics: failing steps tee their output and re-emit the relevant
# tail as ::error:: annotations, so the essential failure information is
# visible without downloading logs.

jobs:
  engine-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode found in /Applications (swift-tools-version 6.0 requires Xcode 16+)"
            exit 1
          fi
          MAJOR=$(defaults read "$XCODE/Contents/Info.plist" CFBundleShortVersionString | cut -d. -f1)
          if [ "$MAJOR" -lt 16 ]; then
            echo "::error::$XCODE is major version $MAJOR — 16+ required"
            exit 1
          fi
          echo "Selected Xcode: $XCODE (major $MAJOR)"
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XCODE"

      - name: Run engine tests (includes KDBX corpus gate)
        shell: bash
        run: set -o pipefail; swift test 2>&1 | tee /tmp/engine-tests.log

      - name: Failure summary
        if: failure()
        run: |
          {
            echo "toolchain: $(swift --version 2>&1 | head -1)"
            echo "── failing summary lines ──"
            grep -E "error:|failed|Executed [0-9]+ tests|Fatal|precondition" /tmp/engine-tests.log | tail -25
          } | while IFS= read -r line; do echo "::error::$line"; done

  engine-ios-simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode found in /Applications (swift-tools-version 6.0 requires Xcode 16+)"
            exit 1
          fi
          MAJOR=$(defaults read "$XCODE/Contents/Info.plist" CFBundleShortVersionString | cut -d. -f1)
          if [ "$MAJOR" -lt 16 ]; then
            echo "::error::$XCODE is major version $MAJOR — 16+ required"
            exit 1
          fi
          echo "Selected Xcode: $XCODE (major $MAJOR)"
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XCODE"

      # macOS-green does not imply iOS-green: compiling and running the whole
      # engine — including the vendored CArgon2 reference C — for the iOS arm64
      # simulator target proves the engine works on arm64 iOS. The destination
      # omits the device name on purpose: xcodebuild picks whatever device the
      # image's latest iOS runtime ships, so device-name rotation cannot break
      # the gate. Runner images no longer preinstall the iOS simulator runtime,
      # so fetch it with Apple's official platform installer first (this is the
      # platform SDK itself, fetched from Apple through the runner's own
      # toolchain — not a third-party dependency).
      - name: Install iOS simulator runtime
        shell: bash
        run: |
          sudo xcodebuild -runFirstLaunch
          set -o pipefail
          xcodebuild -downloadPlatform iOS 2>&1 | tee /tmp/platform-install.log

      - name: Runtime install diagnostics
        if: failure()
        run: |
          {
            echo "── platform install tail ──"
            tail -12 /tmp/platform-install.log 2>/dev/null || echo "(no install log)"
            echo "── runtimes ──"
            xcrun simctl runtime list 2>&1 | head -6 || true
            echo "── devices (available) ──"
            xcrun simctl list devices available | tail -12 || true
          } | while IFS= read -r line; do echo "::error::$line"; done

      # A freshly downloaded runtime ships zero devices (simctl does not
      # auto-create defaults), so create one deterministically from the latest
      # iOS runtime and the newest iPhone device type. The raw runtime and
      # device-type lists are emitted as annotations unconditionally for now —
      # remove once the gate is green.
      - name: Create CI simulator device
        shell: bash
        run: |
          set +e
          RUNTIMES_RAW="$(xcrun simctl list runtimes 2>&1)"
          DEVTYPE_LINE="$(xcrun simctl list devicetypes 2>&1 | grep -E '^iPhone' | tail -1)"
          RUNTIME_ID="$(printf '%s' "$RUNTIMES_RAW" | grep -E 'SimRuntime\.iOS' | tail -1 | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+' | tail -1)"
          DEVTYPE_ID="$(printf '%s' "$DEVTYPE_LINE" | grep -oE 'com\.apple\.CoreSimulator\.SimDeviceType\.[A-Za-z0-9-]+' | tail -1)"
          {
            echo "── runtimes (raw tail) ──"
            printf '%s\n' "$RUNTIMES_RAW" | tail -6
            echo "── chosen: runtime=$RUNTIME_ID devicetype=$DEVTYPE_ID ──"
          } | while IFS= read -r l; do echo "::error::$l"; done
          if [ -z "$RUNTIME_ID" ] || [ -z "$DEVTYPE_ID" ]; then
            echo "::error::cannot resolve runtime/devicetype — see annotations above"
            exit 1
          fi
          xcrun simctl create ci-iphone "$DEVTYPE_ID" "$RUNTIME_ID"

      - name: Run engine tests on iOS Simulator (arm64)
        shell: bash
        run: set -o pipefail; xcodebuild test -scheme RavenCore -destination 'name=ci-iphone' 2>&1 | tee /tmp/ios-tests.log

      - name: Failure summary
        if: failure()
        run: |
          {
            echo "── available simulators (iPhone) ──"
            xcrun simctl list devices available | grep -i iphone | head -6 || true
            echo "── failing summary lines ──"
            grep -E "error:|Testing failed:|TEST FAILED|failed \(" /tmp/ios-tests.log | tail -25
          } | while IFS= read -r line; do echo "::error::$line"; done

  zero-network-gate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The zero-network product promise covers every source tree in this
      # repository, including the vendored CArgon2 reference implementation
      # (upstream Argon2 contains no network symbols either, so the same
      # pattern set applies without an exclusion). A missing directory is a
      # repository setup error, never a pass. Scoping is code directories only
      # — docs/comment prose mentioning network symbols must not false-positive
      # the gate.
      - name: Zero-network grep gate
        run: |
          test -d Sources
          if grep -rEn 'URLSession|NSURLSession|NWPathMonitor|NWConnection|CFNetwork|CFSocket|dataTask|uploadTask|downloadTask|Network\.framework' Sources; then
            echo "::error::Network symbols found — the zero-network guarantee is violated"
            exit 1
          fi

      # Public documentation must exist and must not silently rot: the gate
      # fails the build if any published contract file goes missing.
      - name: Docs presence gate
        run: |
          for f in \
            README.md \
            LICENSE \
            Docs/SHAMIR-PAPER-FORMAT.md \
            Docs/AGPL-COMMITMENT.md \
            Docs/TEST-VECTORS/shamir-paper-v1.json \
            Docs/TEST-VECTORS/seedqr-vectors.json; do
            test -f "$f" || { echo "::error::Missing public doc: $f"; exit 1; }
          done
